<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/CodeSyx/assets/css/style.css">
    <title>CodeSyx - Login</title>
</head>
<body>
    <main class="container-auth invertido">

        <!-- Metade do formulário -->
        <div class="card-auth">
            <div class="logo">
                <img src="/CodeSyx/assets/img/logo.png" alt="logo CodeSyx">
                <h2>Code<span>Syx</span></h2>
            </div>

            <div class="formularios">

                <!-- LOGIN -->
                <div class="tela tela-login">
                    <p class="subtitulo-auth">Seja Bem-Vindo!</p>
                    <form action="#" class="form-auth" id="form-login">
                        <div class="grupo-input">
                            <label for="login-email">E-mail</label>
                            <input type="email" id="login-email" placeholder="Digite seu E-mail..." required>
                        </div>

                        <div class="grupo-input">
                            <label for="login-senha">Senha</label>
                            <input type="password" id="login-senha" placeholder="Digite sua Senha..." required>
                        </div>

                        <button type="submit" class="btn-primeiro btn-full">Entrar</button>
                    </form>
                    <p class="link-alternativo">Não tem uma conta?<a href="#cadastro"> Faça Cadastro</a></p>
                </div>

                <!-- CADASTRO -->
                <div class="tela tela-cadastro">
                    <p class="subtitulo-auth">Seja Bem-Vindo!</p>
                    <form action="#" class="form-auth" id="form-cadastro">
                        <div class="grupo-input">
                            <label for="nome">Nome</label>
                            <input type="text" id="nome" placeholder="Digite seu Nome..." required>
                        </div>
                        <div class="grupo-input">
                            <label for="cad-email">E-mail</label>
                            <input type="email" id="cad-email" placeholder="Digite seu E-mail..." required>
                        </div>

                        <div class="grupo-input">
                            <label for="cad-senha">Senha</label>
                            <input type="password" id="cad-senha" placeholder="Digite sua Senha..." required>
                        </div>

                        <div class="grupo-input">
                            <label for="confirmar-senha">Confirmar Senha</label>
                            <input type="password" id="confirmar-senha" placeholder="Confirme sua senha..." required>
                        </div>

                        <div class="grupo-input">
                            <label for="semestre">Área ou semestre</label>
                            <select id="semestre" class="input-select" required>
                                <option value="">Selecione...</option>
                                <option value="uiux">UI/UX</option>
                                <option value="ads">ADS</option>
                                <option value="java">Java</option>
                                <option value="outros">Outros</option>
                            </select>
                        </div>

                        <button type="submit" class="btn-primeiro btn-full">Cadastrar</button>
                    </form>
                    <p class="link-alternativo">Já tem uma conta?<a href="#login"> Faça Login</a></p>
                </div>

            </div>
        </div>

        <!-- Metade do mascote -->
        <div class="lado-mascote">
            <img src="/CodeSyx/assets/img/mascote-auth.png" alt="Mascote CodeSyx" class="mascote">
            <p class="frase">Aprender, criar e descobrir: juntos, vamos transformar cada desafio em uma nova conquista!</p>
        </div>

    </main>

    <script src="/CodeSyx/assets/js/script.js"></script>
</body>
</html>

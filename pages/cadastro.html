<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/css/style.css">
    <title>CodeSyx - Cadastro</title>
</head>
<body>
    <main class="container-auth">
        <div class="card-auth">
            <div class="logo">
                <img src="/assets/img/logo.png" alt="logo CodeSyx">
                <h2>Code<span>Syx</span></h2>
            </div>

            <p class="subtitulo-auth">Seja Bem-Vindo!</p>
                <form action="#" class="form-auth">
                    <div class="grupo-input">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" placeholder="Digite seu Nome..." required>
                    </div>
                    <div class="grupo-input">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" placeholder="Digite seu E-mail..." required>
                    </div>

                    <div class="grupo-input">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" placeholder="Digite sua Senha..." required>
                        
                    <div class="grupo-input">
                        <label for="confirmar-senha">Confirmar Senha</label>
                        <input type="password" id="confirmar-senha" placeholder="Confirme sua senha..." required>
                    </div>
                    
                    <div class="grupo-input">
                        <label for="semestre">Área ou semestre</label>
                        <select id="semestre" class="input-select">
                            <option value="">Selecione...</option> <!--Opções dentro do select-->
                            <option value="">UI/UX</option>
                            <option value="">ADS</option>
                            <option value="">Java</option>
                            <option value="">Outros</option>
                        </select> <!--Cria uma caixa de seleção, que permite que você escolha uma opção-->
                    </div>

                    <button type="submit" class="btn-primeiro btn-full">Cadastrar</button>
                </form>
                <p class="link-alternativo">Já tem uma conta?<a href="/pages/login.html"> Faça Login</a></p>
        </div>
    </main>
</body>
</html>

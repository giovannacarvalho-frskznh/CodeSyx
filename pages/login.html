<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/css/style.css">
    <title>CodeSyx - Login</title>
</head>
<body>
    <main class="container-auth">
        <div class="card-auth">
            <div class="logo">
                <img src="/assets/img/logo.png" alt="logo CodeSyx">
                <h2>Code<span>Syx</span></h2>
            </div>

            <p class="subtitulo-auth">Seja Bem-Vindo!</p>
                <form action="#" class="form-auth">
                    <div class="grupo-input">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" placeholder="Digite seu E-mail..." required>
                    </div>

                    <div class="grupo-input">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" placeholder="Digite sua Senha..." required>
                    </div>

                    <button type="submit" class="btn-primeiro btn-full">Entrar</button>
                </form>
                <p class="link-alternativo">Não tem uma conta?<a href="/pages/cadastro.html"> Faça Cadastro</a></p>
        </div>
    </main>
</body>
</html>

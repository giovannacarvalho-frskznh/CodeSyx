<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeSyx - Conversas</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/inicial.css">
  <link rel="stylesheet" href="../assets/css/conversas.css">
</head>

<body class="dash-body">

  <input type="checkbox" id="menu-dash" class="menu-dash">
  <label for="menu-dash" class="fundo-menu-dash"></label>

  <header class="dash-topo">
    <label for="menu-dash" class="btn-menu-dash" aria-label="Abrir menu">
      <span></span>
      <span></span>
      <span></span>
    </label>

    <a href="inicial.html" class="logo">
      <img src="../assets/img/logo.png" alt="Logo CodeSyx">
      <h2>Code<span>Syx</span></h2>
    </a>

    <form class="dash-busca">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input class="dash-busca-input" type="text" placeholder="Buscar pessoas, linguagens, matérias...">
    </form>

    <div class="dash-topo-direita">
      <i class="fa-regular fa-bell dash-topo-sino"></i>
      <div class="dash-topo-usuario">
        <div class="dash-usuario-avatar"><img src="../assets/img/carlos.png" alt="foto carlos"></div>
        <div class="dash-usuario-dados">
          <span class="dash-usuario-nome">Carlos</span>
          <span class="dash-usuario-semestre">1º Semestre | ADS</span>
        </div>
        <i class="fa-solid fa-chevron-down"></i>
      </div>
    </div>
  </header>

  <div class="dash-layout dash-layout-duas-colunas">

    <section class="dash-sidebar">
      <div class="dash-menu">
        <a href="inicial.html" class="dash-menu-link">
          <i class="fa-solid fa-house"></i>
          <span>Início</span>
        </a>
        <a href="encontrar_pessoas.html" class="dash-menu-link">
          <i class="fa-solid fa-user-group"></i>
          <span>Encontrar pessoas</span>
        </a>
        <a href="conversas.html" class="dash-menu-link dash-menu-link-ativo">
          <i class="fa-regular fa-comment"></i>
          <span>Conversas</span>
        </a>
        <a href="perfil.html" class="dash-menu-link">
          <i class="fa-regular fa-circle-user"></i>
          <span>Perfil</span>
        </a>
      </div>

      <div class="dash-sidebar-frase">
        <div class="dash-sidebar-frase-titulo">Juntos, vamos mais longe.</div>
        <div class="dash-sidebar-frase-texto">Estude, Evolua e Conquiste.</div>
      </div>
    </section>

    <main class="dash-principal conversas-principal">

      <section class="conversas-container">

        <aside class="conversas-lista">

          <h2 class="conversas-titulo"><i class="fa-regular fa-comments"></i> Conversas</h2>

          <button type="button" class="conversa-item active" data-chat="ana">
            <div class="conversa-foto">
              <img src="../assets/img/anacosta.png" alt="Foto de Ana Costa" class="conversa-avatar">
              <span class="conversa-online"></span>
            </div>
            <div class="conversa-info">
              <div class="conversa-nome">Ana Costa</div>
              <div class="conversa-curso">ADS 3°Semestre</div>
              <div class="conversa-previa">Nenhuma mensagem ainda</div>
            </div>
          </button>

          <button type="button" class="conversa-item" data-chat="gabriel">
            <div class="conversa-foto">
              <img src="../assets/img/gabrielsantos.png" alt="Foto de Gabriel Santos" class="conversa-avatar">
              <span class="conversa-online"></span>
            </div>
            <div class="conversa-info">
              <div class="conversa-nome">Gabriel Santos</div>
              <div class="conversa-curso">ADS 3°Semestre</div>
              <div class="conversa-previa">Nenhuma mensagem ainda</div>
            </div>
          </button>

          <button type="button" class="conversa-item" data-chat="lucas">
            <div class="conversa-foto">
              <img src="../assets/img/lucasalmeida.png" alt="Foto de Lucas Almeida" class="conversa-avatar">
              <span class="conversa-online"></span>
            </div>
            <div class="conversa-info">
              <div class="conversa-nome">Lucas Almeida</div>
              <div class="conversa-curso">ADS 2°Semestre</div>
              <div class="conversa-previa">Nenhuma mensagem ainda</div>
            </div>
          </button>

        </aside>


        <section class="chat-area">

          <div class="chat-header">
            <img src="../assets/img/anacosta.png" alt="Foto de Ana Costa" class="chat-avatar">

            <div class="chat-user-info">
              <h2>Ana Costa</h2>
              <p><span class="status-online"></span><span id="chat-status">Online</span></p>
            </div>

            <button type="button" class="chat-limpar" id="btn-limpar">
              <i class="fa-regular fa-trash-can"></i> Limpar conversa
            </button>
          </div>

          <div class="chat-mensagens" id="chat-mensagens"></div>

          <form class="chat-form" action="#">
            <input type="text" class="chat-input" placeholder="Digite uma mensagem" autocomplete="off">

            <button type="submit" class="chat-send-button" aria-label="Enviar mensagem">
              <i class="fa-solid fa-paper-plane"></i>
            </button>
          </form>

          <img src="../assets/img/CodeSyx-mascote.png" alt="Mascote CodeSyx" class="chat-mascote">

        </section>

      </section>

    </main>
  </div>

  <script src="../assets/js/script.js"></script>
</body>

</html>

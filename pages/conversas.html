<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../assets/css/conversas.css">

    <!-- Fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <title>CodeSyx - Conversas</title>
</head>

<body>

<header class="header">

    <div class="logo-area">
        <div class="logo-icon">
            <img src="../assets/img/logo.png" alt="logo CodeSyx">
        </div>
        <span class="logo-text">Code<span>Syx</span></span>
    </div>

    <form action="#" class="search-form">
        <input type="search" class="search-input" placeholder="Buscar pessoas, linguagens, matérias...">
    </form>

    <button type="button" class="notification-button" aria-label="Notificações">🔔</button>

    <div class="user-area">
        <img src="../assets/img/avatar-carlos.png" alt="Foto de Carlos" class="user-avatar">

        <div class="user-info">
            <p class="user-nome">Carlos</p>
            <p class="user-curso">1°Semestre | ADS</p>
        </div>

        <button type="button" class="user-dropdown" aria-label="Abrir menu do usuário">⌄</button>
    </div>

</header>


<div class="page-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <nav class="sidebar-navigation">

            <a href="inicial.html" class="sidebar-link">
                <span class="sidebar-icon">⌂</span>
                Início
            </a>

            <a href="encontrar_pessoas.html" class="sidebar-link">
                <img src="../assets/img/Find User Male.png" alt="" class="sidebar-icon">
                Encontrar pessoas
            </a>

            <a href="conversas.html" class="sidebar-link active">
                <img src="../assets/img/Speech Bubble.png" alt="" class="sidebar-icon">
                Conversas
            </a>

            <a href="perfil.html" class="sidebar-link">
                <img src="../assets/img/Profile.png" alt="" class="sidebar-icon">
                Perfil
            </a>

        </nav>

        <div class="sidebar-message">
            <h2>Juntos, vamos mais longe.</h2>
            <p>Estude, Evolua e Conquiste.</p>
        </div>

    </aside>


    <!-- CONTEÚDO PRINCIPAL -->
    <main class="main-content">

        <section class="conversas-container">

            <!-- LISTA DE CONVERSAS -->
            <aside class="conversas-lista">

                <h2 class="conversas-titulo">Conversas</h2>

                <button type="button" class="conversa-item active" data-chat="ana">
                    <img src="../assets/img/avatar-ana.png" alt="Foto de Ana Costa" class="conversa-avatar">
                    <div class="conversa-info">
                        <div class="conversa-nome">Ana Costa</div>
                        <div class="conversa-curso">ADS 3°Semestre</div>
                        <div class="conversa-previa">Nenhuma mensagem ainda</div>
                    </div>
                </button>

                <button type="button" class="conversa-item" data-chat="gabriel">
                    <img src="../assets/img/avatar-gabriel.png" alt="Foto de Gabriel Santos" class="conversa-avatar">
                    <div class="conversa-info">
                        <div class="conversa-nome">Gabriel Santos</div>
                        <div class="conversa-curso">ADS 3°Semestre</div>
                        <div class="conversa-previa">Nenhuma mensagem ainda</div>
                    </div>
                </button>

                <button type="button" class="conversa-item" data-chat="lucas">
                    <img src="../assets/img/avatar-lucas.png" alt="Foto de Lucas Almeida" class="conversa-avatar">
                    <div class="conversa-info">
                        <div class="conversa-nome">Lucas Almeida</div>
                        <div class="conversa-curso">ADS 2°Semestre</div>
                        <div class="conversa-previa">Nenhuma mensagem ainda</div>
                    </div>
                </button>

            </aside>


            <!-- CHAT -->
            <section class="chat-area">

                <!-- CABEÇALHO DO CHAT -->
                <div class="chat-header">

                    <img src="../assets/img/avatar-ana.png" alt="Foto de Ana Costa" class="chat-avatar">

                    <div class="chat-user-info">
                        <h2>Ana Costa</h2>
                        <p><span class="status-online"></span><span id="chat-status">Online</span></p>
                    </div>

                    <button type="button" class="chat-limpar" id="btn-limpar">Limpar conversa</button>

                </div>

                <!-- MENSAGENS  -->
                <div class="chat-mensagens" id="chat-mensagens"></div>

                <!-- ÁREA DE ENVIO -->
                <form class="chat-form" action="#">

                    <input type="text" class="chat-input" placeholder="Digite uma mensagem" autocomplete="off">

                    <button type="submit" class="chat-send-button" aria-label="Enviar mensagem">➤</button>

                </form>

               
                <img src="../assets/img/CodeSyx-mascote.png" alt="Mascote CodeSyx" class="chat-mascote">

            </section>

        </section>

    </main>

</div>

<script src="../assets/js/script.js"></script>

</body>

</html>
